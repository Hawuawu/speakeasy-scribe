name: Release
# Builds speakeasy-scribe.exe for the game PC (no Python needed there).
# Pull requests build and upload it as an artifact; a pushed v* tag also publishes a GitHub release.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install . pyinstaller
      - run: pyinstaller --onefile --name speakeasy-scribe --collect-submodules speakeasy_scribe scripts/entry.py
      - name: Smoke test the exe
        shell: bash
        run: |
          ./dist/speakeasy-scribe.exe --version
          ./dist/speakeasy-scribe.exe validate examples/characters/aelindra
          ./dist/speakeasy-scribe.exe apply examples/characters/aelindra --out out.lua
          grep -q SpeakEasyCharDB out.lua
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: speakeasy-scribe-windows
          path: dist/speakeasy-scribe.exe

  publish:
    needs: exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: speakeasy-scribe-windows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" speakeasy-scribe.exe -R "$GITHUB_REPOSITORY" --generate-notes
