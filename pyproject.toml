[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "speakeasy-scribe"
dynamic = ["version"]
description = "Generate character-specific SpeakEasy (WoW addon) scenes from YAML and merge them into SpeakEasy.lua"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "ruff>=0.15"]

[project.scripts]
speakeasy-scribe = "speakeasy_scribe.cli:main"

[tool.setuptools.dynamic]
version = { attr = "speakeasy_scribe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=speakeasy_scribe --cov-report=term-missing --cov-fail-under=90"
